
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1000WIN - Mon portefeuille</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080f20;color:white;font-family:Arial,sans-serif}
header{padding:22px;background:#111d35;text-align:center}
h1{color:#f5c542;margin:0}
main{padding:20px;max-width:500px;margin:auto}
.card{background:#172641;padding:22px;border-radius:15px;margin:18px 0}
.label{color:#b9c5d9}
.balance{font-size:32px;font-weight:bold;color:#f5c542;margin:12px 0}
button{width:100%;padding:15px;border:0;border-radius:9px;margin:7px 0;font-weight:bold;font-size:16px;cursor:pointer}
.deposit{background:#16a36a;color:white}
.withdraw{background:#e2ad29;color:#111}
input{width:100%;padding:14px;margin:8px 0;border-radius:8px;border:0}
h3{color:#f5c542}
.transaction{padding:12px 0;border-bottom:1px solid #34445f}
small{color:#aab8ce}
</style>
</head>
<body>
<header>
<h1>1000WIN</h1>
<p>MON PORTEFEUILLE</p>
</header>

<main>
<div class="card">
<div class="label">Mon solde disponible</div>
<div class="balance" id="balance">0 FCFA</div>
<small>Solde de démonstration</small>
</div>

<div class="card">
<h3>Faire un dépôt</h3>
<input type="number" id="depositAmount" placeholder="Montant en FCFA">
<button class="deposit" onclick="deposit()">Demander un dépôt</button>
</div>

<div class="card">
<h3>Faire un retrait</h3>
<input type="number" id="withdrawAmount" placeholder="Montant en FCFA">
<button class="withdraw" onclick="withdraw()">Demander un retrait</button>
</div>

<div class="card">
<h3>Historique des transactions</h3>
<div id="history">Aucune transaction</div>
</div>
</main>

<script>
let balance=0;
function update(){
document.getElementById("balance").textContent=
balance.toLocaleString("fr-FR")+" FCFA";
}
function deposit(){
let amount=Number(document.getElementById("depositAmount").value);
if(amount<=0)return alert("Entre un montant valide");
addHistory("Demande de dépôt",amount,"En attente");
document.getElementById("depositAmount").value="";
alert("Demande enregistrée. Le solde n'est pas encore crédité.");
}
function withdraw(){
let amount=Number(document.getElementById("withdrawAmount").value);
if(amount<=0)return alert("Entre un montant valide");
addHistory("Demande de retrait",amount,"En attente");
document.getElementById("withdrawAmount").value="";
alert("Demande de retrait enregistrée.");
}
function addHistory(type,amount,status){
let history=document.getElementById("history");
if(history.textContent==="Aucune transaction")history.innerHTML="";
let item=document.createElement("div");
item.className="transaction";
item.textContent=type+" : "+amount.toLocaleString("fr-FR")+" FCFA - "+status;
history.prepend(item);
}
update();
</script>
</body>
</html>
